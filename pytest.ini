[pytest]
testpaths = tests
pythonpath = src
addopts = -ra
markers =
    ui: Tests, die die Streamlit-Oberfläche per AppTest durchlaufen (langsamer, mit -m "not ui" überspringen)
    real_date: Test ohne den festen Preistag der Fixture price_day: echte Uhr, kein Vorab-Import von aibui (tests/conftest.py)
filterwarnings =
    ignore::DeprecationWarning:httplib2.*
